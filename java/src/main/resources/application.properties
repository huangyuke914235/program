spring.application.name=RelayForge
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.config.import=optional:file:.env[.properties]
server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}
server.tomcat.max-http-form-post-size=64KB
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:data/relayforge.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000
relay.api-token=${API_TOKEN:}
relay.demo-mode=${DEMO_MODE:false}
relay.worker-enabled=${WORKER_ENABLED:true}
relay.retry-base-ms=${RETRY_BASE_MS:1000}
